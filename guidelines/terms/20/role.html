<dt><dfn id="dfn-role">role</dfn></dt>
<dd>
   
   <p>text or number by which software can identify the function of a component within web content</p>
   
   <aside class="example">
      <p>A <code>role</code> attribute on an interactive HTML element that indicates whether the element functions as a hyperlink, command button, or check box.</p>
